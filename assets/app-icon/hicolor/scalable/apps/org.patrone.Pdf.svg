<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- PdfCraft (PatroneOS edition): a white page with a folded corner and
       lines of text on a PdfCraft-red tile, signed by a fountain-pen nib that
       comes in from the top-right corner. Full-bleed 512 tile, rx=112. -->
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f25a5f"/>
      <stop offset="0.55" stop-color="#d42a3c"/>
      <stop offset="1" stop-color="#b70228"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceff4"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5366"/>
      <stop offset="0.45" stop-color="#1d222d"/>
      <stop offset="1" stop-color="#2c3342"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4254"/>
      <stop offset="0.4" stop-color="#171b24"/>
      <stop offset="1" stop-color="#0c0e13"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f6f9"/>
      <stop offset="0.5" stop-color="#c3cad5"/>
      <stop offset="1" stop-color="#8f99a8"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="6" dy="12" result="blur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#field)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <g transform="translate(0 12)">
    <!-- The page. -->
    <g filter="url(#drop)">
      <path d="M142 84H276L344 152V378A22 22 0 0 1 322 400H142A22 22 0 0 1 120 378V106A22 22 0 0 1 142 84Z" fill="url(#page)"/>
      <path d="M276 84V134A18 18 0 0 0 294 152H344Z" fill="#cfd6e0"/>
    </g>
    <path d="M162 146H236" stroke="#e5484d" stroke-width="18" stroke-linecap="round"/>
    <path d="M162 196H302M162 236H302M162 276H254" stroke="#c4cad4" stroke-width="16" stroke-linecap="round"/>

    <!-- The signature the nib is writing. -->
    <path d="M160 346C172 318 188 308 192 324S180 358 194 354S216 320 228 326S228 354 244 350S270 334 292 330" fill="none" stroke="#1d2230" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- The pen: nib tip at (292, 330), barrel off the top-right corner. -->
    <g filter="url(#drop)">
      <g transform="translate(292 330) rotate(45)">
        <rect x="-52" y="-440" width="104" height="276" rx="20" fill="url(#barrel)"/>
        <rect x="-32" y="-430" width="12" height="250" rx="6" fill="#ffffff" opacity="0.14"/>
        <rect x="-50" y="-176" width="100" height="26" rx="8" fill="url(#band)"/>
        <path d="M0 0C14 -30 42 -76 42 -112V-152H-42V-112C-42 -76 -14 -30 0 0Z" fill="url(#nib)"/>
        <path d="M0 -10V-80" stroke="#f25a5f" stroke-width="6" stroke-linecap="round"/>
        <circle cx="0" cy="-94" r="10" fill="#f25a5f"/>
      </g>
    </g>
    </g>
  </g>
</svg>
