<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- PdfCraft (PatroneOS edition), drawn for 16-32 px: the master's page and
       pen with the detail that would blur away left out, and everything a
       little bigger and bolder. Full-bleed 512 tile, rx=112. -->
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f04a50"/>
      <stop offset="1" stop-color="#b70228"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#field)"/>

    <!-- The page. -->
    <path d="M128 64H292L376 148V420A28 28 0 0 1 348 448H128A28 28 0 0 1 100 420V92A28 28 0 0 1 128 64Z" fill="#ffffff"/>
    <path d="M292 64V124A24 24 0 0 0 316 148H376Z" fill="#c8d0db"/>
    <path d="M156 196H300M156 268H252" stroke="#aab3c0" stroke-width="40" stroke-linecap="round"/>

    <!-- The pen: nib tip at (276, 372), barrel off the top-right corner. -->
    <g transform="translate(276 372) rotate(45)">
      <rect x="-66" y="-470" width="132" height="290" rx="24" fill="#14171e"/>
      <rect x="-64" y="-196" width="128" height="34" rx="10" fill="#d5dbe4"/>
      <path d="M0 0C18 -34 54 -86 54 -128V-168H-54V-128C-54 -86 -18 -34 0 0Z" fill="#232937"/>
      <circle cx="0" cy="-104" r="16" fill="#f25a5f"/>
    </g>
  </g>
</svg>
